[project]
name = "music-genre-classification"
version = "0.1.0"
description = "Music genre classification app built with Streamlit."
readme = "README.md"
authors = [
    { name = "Antoni Kucharski", email = "antek.kuchar@gmail.com" },
    { name = "Szymon Majdak", email = "szymek.wrc@interia.pl" },
    { name = "Bartłomiej Kózka", email = "bartek.kozka15@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "librosa>=1.0.0",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "rich>=15.0.0",
    "streamlit>=1.66.0",
    "torch>=2.15.0",
]

[project.scripts]
music-genre-classification = "music_genre_classification.cli:main"

[build-system]
requires = ["uv_build>=0.11.13,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "interrogate>=1.7.0",
    "mypy>=2.4.0",
    "pandas-stubs>=3.1.0.261029",
    "pre-commit>=4.7.0",
    "pydoclint>=0.12.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "rich>=15.0.0",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]
preview = true
fix = false
show-fixes = true

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # Mutually exclusive docstring rules: keep D211 (blank-line-before-class) and D212 (multi-line-summary-first-line).
    "incorrect-blank-line-before-class",
    "multi-line-summary-second-line",
    # Conflicts with the ruff formatter.
    "missing-trailing-comma",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "assert",                 # assert is how pytest works
    "magic-value-comparison", # magic values are fine in assertions
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
known-first-party = ["music_genre_classification"]
required-imports = ["from __future__ import annotations"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 5
max-branches = 10
max-returns = 4
max-statements = 40

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
strict = true
python_version = "3.13"
mypy_path = "src"
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool", "explicit-override"]

[[tool.mypy.overrides]]
# scikit-learn and joblib ship no type information.
module = ["sklearn.*", "joblib"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config", "-ra", "--cov=music_genre_classification", "--cov-report=term-missing"]

[tool.pydoclint]
style = "google"
exclude = "tests"
arg-type-hints-in-docstring = false
check-return-types = false
check-yield-types = false
skip-checking-short-docstrings = false
allow-init-docstring = true

[tool.interrogate]
fail-under = 100
ignore-init-method = true
ignore-init-module = true
ignore-private = false
ignore-semiprivate = false
ignore-magic = false
exclude = ["tests"]
verbose = 1

# CI runs on Linux, where PyPI's default torch wheel bundles CUDA; use the much smaller CPU build.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
